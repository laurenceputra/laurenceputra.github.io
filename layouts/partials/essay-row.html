<article class="essay-row" data-tags="{{ delimit .page.Params.tags "|" }}">{{ partial "thumbnail.html" (dict "page" .page "sizes" .sizes) }}<div>
<h2>
<a href="{{ .page.RelPermalink }}">{{ .page.Title }}</a>
</h2>
<p class="metadata">{{ .page.Date.Format "2 Jan 2006" }} · {{ .page.ReadingTime }} min read{{ with .page.Params.tags }} · {{ delimit . ", " }}{{ end }}</p>
<p>{{ .page.Description }}</p>
</div>
</article>
